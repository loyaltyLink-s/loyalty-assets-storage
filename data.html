<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data — Loyalty Assets Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260914">
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">
        <i class="dot dot-r"></i><i class="dot dot-g"></i><i class="dot dot-b"></i>
      </span>
      <span class="brand-text">Loyalty<br>Assets<br>Storage</span>
    </div>

    <nav class="sidebar-nav">
      <a href="login.html" class="nav-item" id="navProfile" data-page="profil.html">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>
        <span>Masuk Sekarang</span>
      </a>
      <a href="index.html" class="nav-item" data-page="index.html">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="data.html" class="nav-item is-active" data-page="data.html">
        <svg viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg>
        <span>Data</span>
      </a>
      <div class="nav-divider"></div>
      <a href="admin.html" class="nav-item" data-page="admin.html" id="navAdmin" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3 7.7 8 9 5-1.3 8-4.5 8-9V6l-8-3Z"/></svg>
        <span>Panel Admin</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="footer-hint">Tersambung ke Google Drive</span>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ===== MAIN ===== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="search">
        <svg viewBox="0 0 24 24"><path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"/></svg>
        <input type="text" id="searchInput" placeholder="Cari file atau folder…">
      </div>

      <div class="topbar-actions">
        <a class="btn-ghost" id="loginBtn" href="login.html">Masuk</a>
        <a class="user-chip" id="userChip" href="profil.html" hidden>
          <img id="userAvatar" src="" alt="">
          <span id="userHandle">Pengguna</span>
        </a>
      </div>
    </header>

    <main class="content">
      <section class="toolbar">
        <nav class="breadcrumb" id="breadcrumb" aria-label="Lokasi folder">
          <button data-index="0">Home</button>
        </nav>

        <div class="toolbar-actions">
          <div class="view-toggle" id="viewToggle">
            <button class="is-active" data-mode="grid" aria-label="Tampilan grid">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
            </button>
            <button data-mode="list" aria-label="Tampilan daftar">
              <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
          </div>
          <div class="popover-wrap">
            <button class="btn-solid" id="manageBtn" hidden>+ Tambah</button>
            <div class="popover" id="managePopover" hidden>
              <button class="btn-ghost" id="uploadTriggerBtn">Upload file</button>
              <button class="btn-ghost" id="newFolderBtn">Buat folder baru</button>
              <input type="file" id="fileInput" hidden>
            </div>
          </div>
        </div>
      </section>

      <section class="file-grid" id="fileGrid"></section>
      <p class="empty-state" id="emptyState" hidden>Nggak ada file atau folder yang cocok. Coba kata kunci lain.</p>
    </main>
  </div>
</div>

<!-- ===== FILE PREVIEW MODAL ===== -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Tutup">✕</button>

    <div class="modal-preview" id="modalPreview"></div>

    <div class="modal-body">
      <div class="modal-head">
        <h2 id="modalTitle">Nama file</h2>
        <span class="modal-meta" id="modalMeta">—</span>
      </div>

      <div class="modal-actions">
        <button class="btn-solid" id="downloadBtn">Download</button>
        <button class="btn-ghost" id="shareBtn">Bagikan ke aplikasi</button>
        <button class="btn-danger" id="deleteBtn" hidden>Hapus</button>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn is-active" data-tab="info">Info</button>
        <button class="tab-btn" data-tab="reviews">Ulasan <span id="reviewCountBadge">0</span></button>
      </div>

      <div class="tab-panel" id="tabInfo">
        <p id="fileTxtPreview" class="txt-preview" hidden></p>
      </div>

      <div class="tab-panel" id="tabReviews" hidden>
        <div class="review-summary">
          <span><strong id="reviewTotal">0</strong> ulasan</span>
          <span><strong id="replyTotal">0</strong> balasan</span>
        </div>

        <div class="review-composer" id="reviewComposer">
          <textarea id="reviewInput" placeholder="Tulis ulasan… (masuk dulu ya)" rows="2"></textarea>
          <button class="btn-solid" id="reviewSubmit">Kirim</button>
        </div>

        <div class="review-list" id="reviewList"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20260914"></script>
<script src="js/common.js?v=20260914"></script>
<script src="js/data.js?v=20260914"></script>
</body>
</html>
